name: iOS Build

on:
  push:
    branches: [ main, cmp_ios_desktop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: 'compose.project.habitstracker'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.app

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install tools
        run: |
          brew install sqlite3
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pip3 install fb-idb --break-system-packages

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Boot simulator
        run: |
          xcrun simctl shutdown all || true
          sleep 5
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if '26' in runtime:
                  for d in devices:
                      if d['name'] == 'iPhone 16' and d.get('isAvailable', True):
                          print(d['udid']); sys.exit(0)
          sys.exit(1)
          " 2>/dev/null) || { xcrun simctl list devices available; exit 1; }
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          echo "Booted: $UDID"

      - name: Build shared framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --build-cache

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.1' \
            -derivedDataPath ./build \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Install app
        run: |
          APP_PATH=$(find ./build -name "HabitsTracker.app" -path "*Debug-iphonesimulator*" | head -1)
          [ -z "$APP_PATH" ] && { find ./build -name "*.app"; exit 1; }
          xcrun simctl install "${{ env.SIMULATOR_UDID }}" "$APP_PATH"

      - name: Launch and capture crash
        run: |
          UDID="${{ env.SIMULATOR_UDID }}"
          BUNDLE_ID="${{ env.BUNDLE_ID }}"

          # Stream logs in background so we catch the crash even if it's instant
          xcrun simctl spawn "$UDID" log stream --level debug \
            --predicate "processImagePath CONTAINS 'HabitsTracker'" > app_log.txt 2>&1 &
          LOG_PID=$!
          sleep 2

          # --console-pty surfaces the Kotlin uncaught-exception message to stdout
          timeout 30 xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" 2>&1 | tee launch_output.txt || true

          sleep 3
          kill $LOG_PID 2>/dev/null || true

          echo "=== launch output ==="
          cat launch_output.txt || true
          echo "=== streamed log (filtered) ==="
          grep -i "exception\|error\|koin\|room\|kotlin\|fatal\|terminat" app_log.txt | head -80 || true
          echo "=== crash reports ==="
          find ~/Library/Logs/DiagnosticReports -name "*HabitsTracker*" 2>/dev/null -exec cat {} \; || echo "none"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            app_log.txt
            launch_output.txt