name: iOS Build

on:
  push:
    branches: [ main, cmp_ios_desktop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    env:
      XCODE_VERSION: '26.1'
      BUNDLE_ID: 'compose.project.habitstracker'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.app

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install tools
        run: |
          brew install sqlite3
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pip3 install fb-idb --break-system-packages

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Boot simulator
        run: |
          xcrun simctl shutdown all || true
          sleep 5
          
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if '26' in runtime:
                  for d in devices:
                      if d['name'] == 'iPhone 16' and d.get('isAvailable', True):
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          " 2>/dev/null) || {
            echo "ERROR: No available iPhone 16 simulator with iOS 26.x found."
            xcrun simctl list devices available
            exit 1
          }
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          echo "Booted simulator: $UDID"

      - name: Cache shared build
        uses: actions/cache@v4
        with:
          path: |
            shared/build
          key: ${{ runner.os }}-shared-build-${{ hashFiles(
            'shared/src/**/*.kt',
            'shared/build.gradle.kts',
            'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-shared-build-

      - name: Build shared framework
        run: ./gradlew \
          :shared:linkDebugFrameworkIosSimulatorArm64 \
          --build-cache \
          --configuration-cache

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.1' \
            -derivedDataPath ./build \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=18.5

      - name: Install app on simulator
        run: |
          APP_PATH=$(find ./build -name "HabitsTracker.app" -path "*Debug-iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: HabitsTracker.app not found in ./build"
            find ./build -name "*.app" | head -20
            exit 1
          fi
          echo "Installing: $APP_PATH"
          xcrun simctl install "${{ env.SIMULATOR_UDID }}" "$APP_PATH"

      - name: Seed database
        # Launch the app once so Room creates the SQLite schema, then inject seed rows.
        # On a fresh iOS install, the DB is created at version 4 with an empty habits
        # table — the MIGRATION_2_3 seed (Drink/Sport/Cannabis/Run) only runs when
        # upgrading from v2, never on first install.
        run: |
          BUNDLE_ID="${{ env.BUNDLE_ID }}"
          UDID="${{ env.SIMULATOR_UDID }}"

          xcrun simctl launch "$UDID" "$BUNDLE_ID"

          # Poll for DB creation (Room initialises it lazily on first DAO access)
          DATA_CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          DB_PATH="$DATA_CONTAINER/Documents/habit_tracker.db"
          echo "Waiting for DB at: $DB_PATH"
          for i in $(seq 1 20); do
            [ -f "$DB_PATH" ] && break
            sleep 1
          done

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 1

          if [ ! -f "$DB_PATH" ]; then
            echo "ERROR: DB was not created within 20 s — app likely crashed."
            echo "=== Crash logs ==="
            find ~/Library/Logs/DiagnosticReports -name "HabitsTracker*" 2>/dev/null \
              | xargs cat 2>/dev/null || echo "No crash logs"
            echo "=== Container contents ==="
            find "$DATA_CONTAINER" -type f 2>/dev/null
            exit 1
          fi

      - name: Capture screenshots
        # `xcrun simctl io tap` was removed in Xcode 26. Use idb (Meta's iPhone
        # Device Bridge) instead — it speaks gRPC to idb_companion.
        run: |
          mkdir -p screenshots
          BUNDLE_ID="${{ env.BUNDLE_ID }}"
          UDID="${{ env.SIMULATOR_UDID }}"

          # Start idb companion (gRPC server that forwards gestures into the simulator)
          idb_companion --udid "$UDID" &
          IDB_PID=$!
          sleep 3

          # Connect the idb Python client (auto-discovers companion on localhost:10882)
          idb connect "$UDID"

          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 3

          # 1. Main screen — "+" button (EmptyHabitScreen, 150×150dp centered at 195, 422)
          xcrun simctl io "$UDID" screenshot screenshots/01_main_screen.png
          echo "Screenshot 1: main screen"

          # 2. Tap "+" → opens IconSelectionDialog
          idb ui tap 195 422
          sleep 2
          xcrun simctl io "$UDID" screenshot screenshots/02_habit_selection_dialog.png
          echo "Screenshot 2: habit selection dialog"

          # 3. Tap first habit icon (Drink) in the dialog
          #    Row(SpaceEvenly), 4 × 60dp icons, ~310dp wide → first icon center x≈84
          #    Dialog centered at y=422; icons row sits ~20pt below center → y≈442
          idb ui tap 84 442
          sleep 2
          xcrun simctl io "$UDID" screenshot screenshots/03_habit_calendar.png
          echo "Screenshot 3: habit calendar screen"

          # 4. Tap a past calendar day → opens status panel
          #    Grid starts x=48, col width≈42pt → Thursday (col 3) x=195
          #    Week 1 (days 8–14) center y≈206 (past if run after the 8th of the month)
          idb ui tap 195 206
          sleep 2
          xcrun simctl io "$UDID" screenshot screenshots/04_status_panel.png
          echo "Screenshot 4: status selection panel"

          kill $IDB_PID 2>/dev/null || true

          echo "All screenshots captured."
          ls -la screenshots/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/